name: jobshot
description: "JobShot - Capture, scan and track your job applications"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Image & OCR
  image_picker: ^1.1.2
  image: ^4.5.0
  google_mlkit_text_recognition: ^0.14.0
  permission_handler: ^11.0.0

  # UI & State
  shared_preferences: ^2.5.0
  intl: ^0.20.0
  flutter_animate: ^4.5.0
  provider: ^6.1.0

  # PDF
  pdf: ^3.11.0
  printing: ^5.13.0

  # Backup & Share
  share_plus: ^10.0.0
  archive: ^4.0.2
  file_picker: ^10.0.0

  # Localizations
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.28.0
  build_runner: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
